<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>Toetsklaar – Topografie</title>
<style>
:root {
  --bg: #110E0C; --cream: #F6EFE4; --gold: #E8A317; --red: #D6453D;
  --gray: #A89884; --ok: #2E8B57; --ink: #2A241C;
  --land: #C5D5A8; --land2: #B8C89A; --water: #A8C8D8; --water2: #8EB8CC;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--cream);
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
button { font: inherit; cursor: pointer; border: none; }
#app { height: 100%; display: flex; flex-direction: column; }

.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 14px; background: var(--bg); border-bottom: 2px solid #2a241c; flex-shrink: 0; }
.brand { font-weight: 700; font-size: 1.1rem; white-space: nowrap; }
.brand span { color: var(--gold); }
.modes { display: flex; gap: 6px; flex-wrap: wrap; }
.mode-btn, .nav-btn, .choice-btn, .start-btn, .chapter-btn {
  background: var(--gray); color: var(--bg); font-weight: 700;
  padding: 8px 14px; border-radius: 8px; transition: 0.15s;
}
.mode-btn:hover, .nav-btn:hover, .start-btn:hover, .chapter-btn:hover { filter: brightness(1.08); }
.mode-btn.active { background: var(--gold); color: var(--bg); }
.mode-btn:focus-visible, .nav-btn:focus-visible, .choice-btn:focus-visible,
.start-btn:focus-visible, .chapter-btn:focus-visible, .mk:focus-visible {
  outline: 3px solid var(--gold); outline-offset: 2px;
}
.spacer { flex: 1; }
.score-box { font-size: 0.9rem; white-space: nowrap; }
.score-box strong { color: var(--gold); }
.progress { height: 8px; background: #2a241c; flex-shrink: 0; }
.progress > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), #f0c14b); transition: width .25s; }

.screen { display: none; flex: 1; min-height: 0; }
.screen.active { display: flex; flex-direction: column; }

#start { align-items: center; justify-content: center; padding: 20px; overflow: auto;
  background: radial-gradient(ellipse at 50% 30%, #1c1814 0%, var(--bg) 70%); }
.start-card { background: #1a1612; border: 2px solid #3a3228; border-radius: 20px;
  padding: 32px 36px; max-width: 720px; width: 100%; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.45); }
.start-card h1 { font-size: clamp(1.5rem, 3vw, 2.1rem); margin-bottom: 8px; }
.start-card h1 em { font-style: normal; color: var(--gold); }
.start-card > p { color: var(--gray); margin-bottom: 22px; }
.section-label { text-align: left; color: var(--gold); font-weight: 700; font-size: .8rem;
  text-transform: uppercase; letter-spacing: .08em; margin: 16px 0 8px; }
.chapters, .mode-picks { display: grid; gap: 10px; }
.chapters { grid-template-columns: 1fr; }
@media (min-width: 600px) {
  .chapters { grid-template-columns: 1fr 1fr 1fr; }
  .mode-picks { grid-template-columns: repeat(4, 1fr); }
}
.mode-picks { grid-template-columns: 1fr 1fr; }
.chapter-btn { background: #2a241c; color: var(--cream); border: 2px solid #3a3228;
  padding: 14px 10px; border-radius: 12px; text-align: center; }
.chapter-btn small { display: block; color: var(--gray); font-weight: 500; margin-top: 4px; font-size: .78rem; }
.chapter-btn.selected { border-color: var(--gold); background: #3a2e14; color: var(--gold); }
.start-btn.primary { margin-top: 24px; width: 100%; background: var(--gold); color: var(--bg);
  font-size: 1.1rem; padding: 14px; border-radius: 12px; }
.start-btn.primary:disabled { opacity: .4; cursor: not-allowed; }
.hint { margin-top: 12px; font-size: .82rem; color: #6a5e50; }

#play { background: #1a1612; }
.prompt-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px; border-bottom: 1px solid #2a241c; flex-shrink: 0; min-height: 56px; }
.prompt-text { font-size: clamp(1.05rem, 2.2vw, 1.4rem); font-weight: 700; flex: 1; min-width: 180px; }
.prompt-text .cat { color: var(--gray); font-weight: 500; font-size: .85em; margin-right: 8px; }
.prompt-text .ask { color: var(--gold); }
.feedback { font-weight: 700; min-width: 100px; text-align: right; }
.feedback.ok { color: #5ecf8a; } .feedback.bad { color: #ff7a72; } .feedback.info { color: var(--gold); }

.map-wrap { flex: 1; min-height: 0; display: flex; align-items: stretch; justify-content: center;
  padding: 6px; background: #0d0b09; gap: 6px; }
.map-pane { flex: 1; min-width: 0; position: relative; display: flex; }
.map-pane svg.map { width: 100%; height: 100%; display: block; border-radius: 8px; background: var(--water); }

/* SVG markers */
.mk { cursor: pointer; }
.mk circle.hit { fill: #fff; stroke: #2A241C; stroke-width: 2.5; }
.mk.area circle.hit { fill: #fff8e7; stroke: #6a5530; }
.mk.water circle.hit { fill: #e8f4fa; stroke: #2a6080; }
.mk.highlight circle.hit { fill: var(--gold); stroke: #fff; stroke-width: 3; }
.mk.highlight circle.ring { opacity: 1; animation: pulseR 1.1s ease-in-out infinite; }
.mk.correct circle.hit { fill: var(--ok); stroke: #fff; }
.mk.wrong circle.hit { fill: var(--red); stroke: #fff; }
.mk.blink circle.hit { fill: var(--ok); stroke: #fff; animation: blinkC .45s ease-in-out 4; }
.mk circle.ring { fill: none; stroke: rgba(232,163,23,.45); stroke-width: 6; opacity: 0; pointer-events: none; }
.mk .tip { display: none; pointer-events: none; }
.mk.show-tip .tip, .mk:hover .tip, .mk:focus .tip { display: block; }
.mk .tip rect { fill: rgba(17,14,12,.92); stroke: var(--gold); stroke-dasharray: 3 2; }
.mk .tip text { fill: var(--cream); font-family: "Segoe UI", system-ui, sans-serif; font-size: 12px; font-weight: 700; }
.mk .code { fill: #2A241C; font-family: "Segoe UI", system-ui, sans-serif; font-size: 9px; font-weight: 800;
  text-anchor: middle; dominant-baseline: central; pointer-events: none; display: none; }
.learn .mk .code { display: block; }

@keyframes pulseR {
  0%,100% { stroke-width: 5; opacity: .7; }
  50% { stroke-width: 12; opacity: .25; }
}
@keyframes blinkC {
  0%,100% { opacity: 1; }
  50% { opacity: .45; }
}

.choices { display: none; grid-template-columns: 1fr 1fr; gap: 8px;
  padding: 8px 14px 12px; background: #1a1612; flex-shrink: 0; }
.choices.visible { display: grid; }
@media (min-width: 700px) { .choices { grid-template-columns: repeat(4, 1fr); } }
.choice-btn { background: var(--cream); color: var(--ink); padding: 12px 10px; border-radius: 10px;
  font-size: 1rem; text-align: center; border: 3px solid transparent; }
.choice-btn .num { color: var(--gray); font-weight: 800; margin-right: 6px; }
.choice-btn.correct { background: #c8efd8; border-color: var(--ok); }
.choice-btn.wrong { background: #f8c8c4; border-color: var(--red); }
.choice-btn:disabled { cursor: default; }

.type-row { display: none; gap: 8px; padding: 8px 14px 12px; background: #1a1612; flex-shrink: 0; align-items: center; }
.type-row.visible { display: flex; }
#typeInput { flex: 1; font-size: 1.1rem; padding: 12px 14px; border-radius: 10px;
  border: 3px solid #3a3228; background: var(--cream); color: var(--ink); font-weight: 600; }
#typeInput:focus { outline: none; border-color: var(--gold); }
.type-row .nav-btn { background: var(--gold); color: var(--bg); padding: 12px 18px; }

#end { align-items: center; justify-content: center; padding: 24px; overflow: auto;
  background: radial-gradient(ellipse at 50% 30%, #1c1814 0%, var(--bg) 70%); }
.end-card { background: #1a1612; border: 2px solid #3a3228; border-radius: 20px;
  padding: 32px; max-width: 560px; width: 100%; text-align: center; }
.grade { font-size: 4rem; font-weight: 800; color: var(--gold); line-height: 1; margin: 12px 0; }
.end-stats { color: var(--gray); margin-bottom: 12px; }
.practice-list { text-align: left; background: #0d0b09; border-radius: 12px; padding: 14px 18px;
  margin: 12px 0; max-height: 220px; overflow: auto; }
.practice-list h3 { color: var(--gold); font-size: .95rem; margin-bottom: 8px; }
.practice-list li { margin: 4px 0; list-style: none; }
.practice-list li::before { content: "• "; color: var(--red); }
.end-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.end-actions .nav-btn { min-width: 140px; padding: 12px 16px; }
.end-actions .nav-btn.gold { background: var(--gold); color: var(--bg); }
.inset-label { font-size: 11px; fill: #4a4035; font-weight: 600; }

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Toetsklaar – <span>Topografie</span></div>
    <div class="modes" id="playModes" style="display:none">
      <button type="button" class="mode-btn" data-mode="aanwijzen">Aanwijzen</button>
      <button type="button" class="mode-btn" data-mode="benoemen">Benoemen</button>
      <button type="button" class="mode-btn" data-mode="typen">Typen</button>
      <button type="button" class="mode-btn" data-mode="leren">Leren</button>
    </div>
    <div class="spacer"></div>
    <div class="score-box" id="scoreText"></div>
    <button type="button" class="nav-btn" id="btnHome" title="Terug naar menu">← Menu</button>
  </header>
  <div class="progress"><i id="progressBar"></i></div>

  <section id="start" class="screen active">
    <div class="start-card">
      <h1>Toetsklaar – <em>Topografie</em></h1>
      <p>Oefen voor je topografietoets. Kies een hoofdstuk en een oefenvorm.</p>
      <div class="section-label">Hoofdstuk</div>
      <div class="chapters">
        <button type="button" class="chapter-btn" data-ch="us">H2 P2<br>Verenigde Staten
          <small>15 plekken · landen, staten, steden, wateren</small></button>
        <button type="button" class="chapter-btn" data-ch="ng">H1 P1<br>Nigeria
          <small>13 plekken · steden, buurlanden, rivieren</small></button>
        <button type="button" class="chapter-btn" data-ch="all">Alles
          <small>Beide hoofdstukken · 28 plekken</small></button>
      </div>
      <div class="section-label">Oefenvorm</div>
      <div class="mode-picks">
        <button type="button" class="chapter-btn mode-pick" data-mode="aanwijzen">Aanwijzen
          <small>Klik de juiste plek</small></button>
        <button type="button" class="chapter-btn mode-pick" data-mode="benoemen">Benoemen
          <small>Kies uit 4 namen</small></button>
        <button type="button" class="chapter-btn mode-pick" data-mode="typen">Typen
          <small>Typ de naam</small></button>
        <button type="button" class="chapter-btn mode-pick" data-mode="leren">Leren
          <small>Bekijk alle namen</small></button>
      </div>
      <button type="button" class="start-btn primary" id="btnStart" disabled>Start oefenen</button>
      <p class="hint">Toetsenbord: 1–4 bij meerkeuze, Enter bij typen. Werkt offline.</p>
    </div>
  </section>

  <section id="play" class="screen">
    <div class="prompt-bar">
      <div class="prompt-text" id="prompt"></div>
      <div class="feedback" id="feedback"></div>
      <div id="playTitle" style="color:var(--gray);font-size:0.85rem;white-space:nowrap"></div>
    </div>
    <div class="map-wrap" id="mapWrap"></div>
    <div class="choices" id="choices"></div>
    <div class="type-row" id="typeRow">
      <input id="typeInput" type="text" autocomplete="off" spellcheck="false" placeholder="Typ de naam…"/>
      <button type="button" class="nav-btn" id="btnTypeOk">OK</button>
    </div>
  </section>

  <section id="end" class="screen">
    <div class="end-card">
      <h2 id="endTitle">Klaar!</h2>
      <div class="grade" id="gradeNum">8</div>
      <p class="end-stats" id="endStats"></p>
      <div class="practice-list" id="practiceList"></div>
      <div class="end-actions">
        <button type="button" class="nav-btn gold" id="btnAgain">Nog een keer</button>
        <button type="button" class="nav-btn" id="btnHome2">← Menu</button>
      </div>
    </div>
  </section>
</div>

      { id: 'us-b', code: 'b', name: 'Mississippi', cat: 'Staten', kind: 'area' },
      { id: 'us-c', code: 'c', name: 'New Hampshire', cat: 'Staten', kind: 'area' },

};

const state = {
  chapter: null, mode: null, queue: [], retry: [],
  index: 0, correct: 0, answered: 0, total: 0, missed: [], locked: false
};

function $(s) { return document.querySelector(s); }
function $all(s) { return [...document.querySelectorAll(s)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function getItems(ch) {
  if (ch === 'all') return CHAPTERS.us.items.concat(CHAPTERS.ng.items);
  return CHAPTERS[ch].items.slice();
}
function findItem(id) {
  return CHAPTERS.us.items.find(i => i.id === id) || CHAPTERS.ng.items.find(i => i.id === id);
}
function showScreen(id) {
  $all('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  const playing = id === 'play';
  $('#playModes').style.display = playing ? 'flex' : 'none';
  $('#btnHome').style.visibility = (id === 'play' || id === 'end') ? 'visible' : 'hidden';
}
function setChapter(ch) {
  state.chapter = ch;
  $all('.chapter-btn[data-ch]').forEach(b => b.classList.toggle('selected', b.dataset.ch === ch));
  updateStartEnabled();
}
function setMode(mode) {
  state.mode = mode;
  $all('.mode-pick').forEach(b => b.classList.toggle('selected', b.dataset.mode === mode));
  updateStartEnabled();
}
function updateStartEnabled() {
  $('#btnStart').disabled = !(state.chapter && state.mode);
}

function markerCoords(item) {
  const key = item.id.startsWith('us') ? 'us' : 'ng';
  const m = MAP_DATA[key].markers[item.code];
  return { key, x: m.x, y: m.y };
}

function buildMarkerGroup(item, x, y) {
  const NS = 'http://www.w3.org/2000/svg';
  const g = document.createElementNS(NS, 'g');
  g.classList.add('mk', item.kind || 'area');
  g.dataset.id = item.id;
  g.setAttribute('tabindex', '0');
  g.setAttribute('role', 'button');
  const label = item.code + ' · ' + item.name + (item.note ? ' (' + item.note + ')' : '') + ' (' + item.cat + ')';
  g.setAttribute('aria-label', item.name);
  g.setAttribute('transform', 'translate(' + x + ',' + y + ')');

  const ring = document.createElementNS(NS, 'circle');
  ring.setAttribute('class', 'ring'); ring.setAttribute('r', '14'); ring.setAttribute('cx', '0'); ring.setAttribute('cy', '0');
  const hit = document.createElementNS(NS, 'circle');
  hit.setAttribute('class', 'hit'); hit.setAttribute('r', '11'); hit.setAttribute('cx', '0'); hit.setAttribute('cy', '0');
  // invisible larger hit target
  const big = document.createElementNS(NS, 'circle');
  big.setAttribute('r', '18'); big.setAttribute('cx', '0'); big.setAttribute('cy', '0');
  big.setAttribute('fill', 'transparent');

  const code = document.createElementNS(NS, 'text');
  code.setAttribute('class', 'code'); code.textContent = item.code;

  const tip = document.createElementNS(NS, 'g');
  tip.setAttribute('class', 'tip');
  const tipText = item.code + ' · ' + item.name + (item.note ? ' (' + item.note + ')' : '');
  const tw = Math.max(80, tipText.length * 7.2);
  const rect = document.createElementNS(NS, 'rect');
  rect.setAttribute('x', String(-tw / 2)); rect.setAttribute('y', '-36');
  rect.setAttribute('width', String(tw)); rect.setAttribute('height', '22');
  rect.setAttribute('rx', '5');
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', '0'); t.setAttribute('y', '-21');
  t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'middle');
  t.textContent = tipText;
  tip.appendChild(rect); tip.appendChild(t);

  g.appendChild(ring); g.appendChild(big); g.appendChild(hit); g.appendChild(code); g.appendChild(tip);
  g.addEventListener('click', () => onMarkerClick(item, g));
  g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onMarkerClick(item, g); } });
  return g;
}

function renderMaps() {
  const wrap = $('#mapWrap');
  wrap.innerHTML = '';
  wrap.classList.toggle('learn', state.mode === 'leren');
  const needUs = state.chapter === 'us' || state.chapter === 'all';
  const needNg = state.chapter === 'ng' || state.chapter === 'all';

  function addPane(tplId, mapKey) {
    const pane = document.createElement('div');
    pane.className = 'map-pane';
    pane.dataset.map = mapKey;
    pane.innerHTML = document.getElementById(tplId).innerHTML;
    wrap.appendChild(pane);
    const svg = pane.querySelector('svg.map');
    let layer = svg.querySelector('.markers');
    if (!layer) {
      layer = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      layer.setAttribute('class', 'markers');
      svg.appendChild(layer);
    }
    const items = getItems(state.chapter).filter(i => i.id.startsWith(mapKey === 'us' ? 'us' : 'ng'));
    for (const item of items) {
      const { x, y } = markerCoords(item);
      layer.appendChild(buildMarkerGroup(item, x, y));
    }
    if (state.mode === 'leren') svg.classList.add('learn');
  }
  if (needUs) addPane('tpl-us', 'us');
  if (needNg) addPane('tpl-ng', 'ng');
}

function markerEl(id) { return document.querySelector('.mk[data-id="' + id + '"]'); }

function clearMarkerStates() {
  $all('.mk').forEach(m => m.classList.remove('highlight', 'correct', 'wrong', 'blink', 'show-tip'));
}

function updateScore() {
  const done = state.answered;
  $('#progressBar').style.width = (state.total ? Math.min(100, (done / state.total) * 100) : 0) + '%';
  if (state.mode === 'leren') {
    $('#scoreText').innerHTML = 'Leermodus · <strong>' + getItems(state.chapter).length + '</strong> plekken';
    return;
  }
  $('#scoreText').innerHTML = 'Score: <strong>' + state.correct + '</strong>/' + state.answered +
    ' · ' + Math.min(state.index + 1, state.queue.length) + '/' + state.queue.length;
}

function startGame() {
  if (!state.chapter || !state.mode) return;
  const items = getItems(state.chapter);
  state.queue = shuffle(items);
  state.retry = [];
  state.index = 0; state.correct = 0; state.answered = 0;
  state.total = items.length; state.missed = []; state.locked = false;
  showScreen('play');
  $all('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
  $('#playTitle').textContent = state.chapter === 'all' ? 'Alles' : CHAPTERS[state.chapter].title;
  renderMaps();
  updateScore();
  if (state.mode === 'leren') enterLearn();
  else nextQuestion();
}

function enterLearn() {
  $('#prompt').innerHTML = '<span class="cat">Leren</span>Bekijk alle plekken — hover of klik op een stip';
  $('#feedback').textContent = '';
  $('#feedback').className = 'feedback';
  $('#choices').classList.remove('visible');
  $('#typeRow').classList.remove('visible');
  $all('.mk').forEach(m => m.classList.add('show-tip'));
  $all('svg.map').forEach(s => s.classList.add('learn'));
  $('#progressBar').style.width = '100%';
  updateScore();
}

function currentItem() { return state.queue[state.index]; }

function nextQuestion() {
  state.locked = false;
  clearMarkerStates();
  $('#choices').classList.remove('visible');
  $('#typeRow').classList.remove('visible');
  $('#feedback').textContent = '';
  $('#feedback').className = 'feedback';

  if (state.index >= state.queue.length) { finishGame(); return; }
  const item = currentItem();
  updateScore();

  if (state.mode === 'aanwijzen') {
    $('#prompt').innerHTML = '<span class="cat">' + item.cat + '</span>Klik op: <span class="ask">' +
      item.name + (item.note ? ' (' + item.note + ')' : '') + '</span>';
  } else if (state.mode === 'benoemen') {
    $('#prompt').innerHTML = '<span class="cat">' + item.cat + '</span>Hoe heet deze plek?';
    markerEl(item.id)?.classList.add('highlight');
    showChoices(item);
  } else if (state.mode === 'typen') {
    $('#prompt').innerHTML = '<span class="cat">' + item.cat + '</span>Typ de naam van deze plek';
    markerEl(item.id)?.classList.add('highlight');
    $('#typeRow').classList.add('visible');
    $('#typeInput').value = '';
    setTimeout(() => $('#typeInput').focus(), 50);
  }
}

function showChoices(item) {
  const mapKey = item.id.startsWith('us') ? 'us' : 'ng';
  const pool = CHAPTERS[mapKey].items.filter(i => i.id !== item.id);
  let same = shuffle(pool.filter(i => i.cat === item.cat));
  let distractors = same.slice(0, 3);
  if (distractors.length < 3) {
    const rest = shuffle(pool.filter(i => !distractors.includes(i)));
    while (distractors.length < 3 && rest.length) distractors.push(rest.shift());
  }
  const choices = shuffle([item, ...distractors.slice(0, 3)]);
  const box = $('#choices');
  box.innerHTML = '';
  choices.forEach((c, idx) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'choice-btn'; b.dataset.id = c.id;
    b.innerHTML = '<span class="num">' + (idx + 1) + '</span>' + c.name + (c.note ? ' (' + c.note + ')' : '');
    b.addEventListener('click', () => onChoice(c, b));
    box.appendChild(b);
  });
  box.classList.add('visible');
}

function recordMiss(item) {
  if (!state.missed.find(m => m.id === item.id)) state.missed.push(item);
}

function onMarkerClick(item, el) {
  if (state.mode === 'leren') {
    $all('.mk').forEach(m => m.classList.remove('highlight'));
    el.classList.add('highlight', 'show-tip');
    $('#prompt').innerHTML = '<span class="cat">' + item.cat + '</span><span class="ask">' +
      item.code + ' · ' + item.name + (item.note ? ' (' + item.note + ')' : '') + '</span>';
    return;
  }
  if (state.mode !== 'aanwijzen' || state.locked) return;
  const cur = currentItem();
  state.locked = true;
  if (item.id === cur.id) {
    el.classList.add('correct');
    $('#feedback').textContent = 'Goed!';
    $('#feedback').className = 'feedback ok';
    state.correct++; state.answered++;
    updateScore();
    setTimeout(() => { state.index++; nextQuestion(); }, 600);
  } else {
    el.classList.add('wrong');
    const right = markerEl(cur.id);
    if (right) right.classList.add('blink', 'show-tip');
    $('#feedback').textContent = 'Fout → ' + cur.name;
    $('#feedback').className = 'feedback bad';
    recordMiss(cur); state.answered++; state.retry.push(cur);
    updateScore();
    setTimeout(() => { state.index++; nextQuestion(); }, 1300);
  }
}

function onChoice(choice, btn) {
  if (state.locked || state.mode !== 'benoemen') return;
  state.locked = true;
  const cur = currentItem();
  $all('.choice-btn').forEach(b => { b.disabled = true; });
  if (choice.id === cur.id) {
    btn.classList.add('correct');
    $('#feedback').textContent = 'Goed!';
    $('#feedback').className = 'feedback ok';
    state.correct++; state.answered++;
    updateScore();
    setTimeout(() => { state.index++; nextQuestion(); }, 600);
  } else {
    btn.classList.add('wrong');
    $all('.choice-btn').forEach(b => { if (b.dataset.id === cur.id) b.classList.add('correct'); });
    $('#feedback').textContent = 'Fout → ' + cur.name;
    $('#feedback').className = 'feedback bad';
    recordMiss(cur); state.answered++; state.retry.push(cur);
    updateScore();
    setTimeout(() => { state.index++; nextQuestion(); }, 1100);
  }
}

function normalize(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
}
function editDistance(a, b) {
  if (Math.abs(a.length - b.length) > 1) return 99;
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
  }
  return dp[m][n];
}

function submitType() {
  if (state.locked || state.mode !== 'typen') return;
  const cur = currentItem();
  const raw = $('#typeInput').value.trim();
  if (!raw) return;
  state.locked = true;
  const ans = normalize(raw), right = normalize(cur.name), dist = editDistance(ans, right);
  if (ans === right) {
    $('#feedback').textContent = 'Goed!';
    $('#feedback').className = 'feedback ok';
    markerEl(cur.id)?.classList.add('correct');
    state.correct++; state.answered++; updateScore();
    setTimeout(() => { state.index++; nextQuestion(); }, 600);
  } else if (dist === 1) {
    $('#feedback').textContent = 'Bijna! Juiste spelling: ' + cur.name;
    $('#feedback').className = 'feedback info';
    markerEl(cur.id)?.classList.add('correct');
    state.correct++; state.answered++; updateScore();
    setTimeout(() => { state.index++; nextQuestion(); }, 1100);
  } else {
    $('#feedback').textContent = 'Fout → ' + cur.name;
    $('#feedback').className = 'feedback bad';
    markerEl(cur.id)?.classList.add('blink', 'show-tip');
    recordMiss(cur); state.answered++; state.retry.push(cur); updateScore();
    setTimeout(() => { state.index++; nextQuestion(); }, 1300);
  }
}

function finishGame() {
  if (state.retry.length) {
    const extra = shuffle(state.retry);
    state.retry = [];
    state.queue = state.queue.concat(extra);
    nextQuestion();
    return;
  }
  showScreen('end');
  const total = state.answered || 1;
  const pct = state.correct / total;
  let grade = Math.round(pct * 9 + 1);
  if (pct >= 0.95) grade = 10;
  if (pct <= 0) grade = 1;
  grade = Math.max(1, Math.min(10, grade));
  $('#gradeNum').textContent = String(grade);
  $('#endTitle').textContent = grade >= 8 ? 'Goed gedaan!' : grade >= 6 ? 'Netjes!' : 'Nog even oefenen';
  $('#endStats').textContent = state.correct + ' van ' + total + ' goed (' + Math.round(pct * 100) + '%)';
  const list = $('#practiceList');
  if (state.missed.length) {
    list.innerHTML = '<h3>Nog oefenen</h3><ul>' + state.missed.map(m =>
      '<li>' + m.code + ' · ' + m.name + ' <span style="color:#A89884">(' + m.cat + ')</span></li>'
    ).join('') + '</ul>';
  } else {
    list.innerHTML = '<h3>Alles goed!</h3><p style="color:#5ecf8a">Je kent alle plekken.</p>';
  }
}

function switchMode(mode) {
  state.mode = mode;
  $all('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  if (!state.chapter) return;
  const items = getItems(state.chapter);
  state.queue = shuffle(items); state.retry = [];
  state.index = 0; state.correct = 0; state.answered = 0;
  state.total = items.length; state.missed = []; state.locked = false;
  renderMaps(); updateScore();
  if (mode === 'leren') enterLearn(); else nextQuestion();
}

function goHome() { showScreen('start'); }

document.addEventListener('keydown', (e) => {
  if (!$('#play').classList.contains('active')) return;
  if (state.mode === 'benoemen' && !state.locked) {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4) {
      const btns = $all('.choice-btn');
      if (btns[n - 1]) btns[n - 1].click();
    }
  }
  if (state.mode === 'typen' && e.key === 'Enter') {
    e.preventDefault();
    submitType();
  }
});

function initApp() {
  $all('.chapter-btn[data-ch]').forEach(b => b.addEventListener('click', () => setChapter(b.dataset.ch)));
  $all('.mode-pick').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
  $('#btnStart').addEventListener('click', startGame);
  $('#btnTypeOk').addEventListener('click', submitType);
  $all('.mode-btn').forEach(b => b.addEventListener('click', () => switchMode(b.dataset.mode)));
  $('#btnHome').addEventListener('click', goHome);
  $('#btnAgain').addEventListener('click', startGame);
  $('#btnHome2').addEventListener('click', goHome);
  setChapter('us');
  setMode('aanwijzen');
  $('#btnHome').style.visibility = 'hidden';
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
else initApp();

</script>
